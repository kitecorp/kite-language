plugins {
    id 'java'
    id('org.gradlex.extra-java-module-info') version "1.12"
    id 'antlr'
}

group 'cloud.kitelang'
version '0.1.0'

repositories {
    mavenCentral()
}

def lombok = '1.18.44'

dependencies {
    // Standalone, settings.gradle includes ../kite-api as a composite build that substitutes this
    // coordinate. Inside the kite superproject, kite-api is a project of the same build instead.
    // Either form alone breaks the other build, which is why this line kept flipping between them.
    implementation(findProject(':kite-api') != null ? project(':kite-api') : 'cloud.kitelang:kite-api')
    antlr "org.antlr:antlr4:4.13.1"
    implementation "org.antlr:antlr4-runtime:4.13.1"

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'
    implementation 'org.fusesource.jansi:jansi:2.4.2'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.jetbrains:annotations:26.0.1'

    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"
    // SLF4J API needed for Lombok's @Slf4j annotation
    annotationProcessor 'org.slf4j:slf4j-api:2.0.17'

    testCompileOnly "org.projectlombok:lombok:${lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.junit.platform:junit-platform-suite-engine:1.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation "org.mockito:mockito-core:3.+"
}

test {
    useJUnitPlatform()
//    maxParallelForks = Runtime.runtime.availableProcessors() // commented as it doesn't improve performance right now
//    testLogging { events "started", "passed", "skipped", "failed" }
}
extraJavaModuleInfo {
    failOnMissingModuleInfo.set(false)
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}
generateGrammarSource {
    maxHeapSize = "128m"
    arguments += ["-visitor", "-Xexact-output-dir", "-package", "cloud.kitelang.syntax.ast.generated"]
    outputDirectory = file("${buildDir}/generated-src/antlr/main/cloud/kitelang/syntax/ast/generated")

    doFirst {
        outputDirectory.mkdirs()
    }
}

// grammar/ is the kite-grammar git submodule. When it is not checked out, generateGrammarSource
// has no input and is skipped, and javac then fails on every missing generated class. Fail first
// with the command that fixes it.
def parserGrammar = file('grammar/KiteParser.g4')

// Ensure compileJava depends on grammar generation
compileJava {
    dependsOn generateGrammarSource
    doFirst {
        if (!parserGrammar.exists()) {
            throw new GradleException("${parserGrammar} not found: the grammar/ submodule is not checked out. Run: git submodule update --init")
        }
    }
}
sourceSets {
    main {
        antlr {
            srcDirs = ["grammar"]
        }
        java {
            srcDirs += ["${buildDir}/generated-src/antlr/main"]
        }
    }
}
configurations {
    // Prevent ANTLR tool (with icu4j) from leaking into runtime
    // Only antlr4-runtime is needed at runtime
    implementation {
        exclude group: 'com.ibm.icu', module: 'icu4j'
    }
    testClasses {
        canBeResolved = true  // ✅ this is key
        canBeConsumed = true
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveClassifier.set('test')
//    from sourceSets.test.output
    from(sourceSets.test.output) {
        include 'cloud/kitelang/base/**'
    }
}

artifacts {
    testClasses testJar
}
